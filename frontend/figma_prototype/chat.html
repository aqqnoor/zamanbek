<!doctype html><meta charset="utf-8">
<title>Zamanbek Chat (dev)</title>
<style>
  body{font:16px/1.4 system-ui,Arial;margin:0;background:#0b1220;color:#eef2ff}
  .wrap{max-width:760px;margin:32px auto;padding:16px}
  .box{background:#111b2e;border:1px solid #203354;border-radius:14px;padding:16px}
  .row{display:flex;gap:8px;margin-top:12px}
  input,button{font:inherit} input{flex:1;padding:10px;border-radius:10px;border:1px solid #203354;background:#0f182a;color:#fff}
  button{padding:10px 14px;border-radius:10px;border:1px solid #2b4a7a;background:#1a2b49;color:#fff;cursor:pointer}
  .msg{white-space:pre-wrap;padding:10px;border-radius:10px;margin:8px 0}
  .me{background:#1a2b49} .bot{background:#0f182a}
</style>
<div class="wrap">
  <h2>🕌 Zamanbek — чат (локально)</h2>
  <div class="box" id="log" aria-live="polite"></div>
  <div class="row">
    <input id="inp" placeholder="Жазыңыз…" />
    <button id="send">Жіберу</button>
  </div>
  <p><small>Сеанс cookie арқылы сақталады. <a href="#" id="reset">Сеансты тазалау</a></small></p>
</div>
<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const send = document.getElementById('send');
const reset = document.getElementById('reset');

function add(role, text){
  const d=document.createElement('div');
  d.className='msg ' + (role==='user'?'me':'bot');
  d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight;
}
async function chat(message){
  add('user', message);
  const res = await fetch('/llm/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json; charset=utf-8'},
    body: JSON.stringify({message})
  });
  const data = await res.json();
  add('assistant', data.reply || '(жауап жоқ)');
}
send.onclick = ()=>{ const m=inp.value.trim(); if(!m) return; inp.value=''; chat(m); };
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') send.click(); });
reset.onclick = async (e)=>{ e.preventDefault(); await fetch('/session/clear'); log.innerHTML=''; add('assistant','Сеанс тазаланды ✅'); };
add('assistant','Сәлем! Қалай көмектесейін?');
</script>
